name: Build DrFPV

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt5-qmake qtbase5-dev libiio-dev
      - name: Configure
        run: mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Release ..
      - name: Build
        run: cd build && make -j$(nproc)
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-linux-x64
          path: build/DrFPV

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt'
          setup-python: false
      - name: Install libiio
        run: |
          curl -L -o libiio-setup.exe https://github.com/analogdevicesinc/libiio/releases/download/v0.25/libiio-0.25-windows-x64.exe
          ./libiio-setup.exe /S /D=C:\libiio
        shell: powershell
      - name: Add libiio to PATH
        run: echo "C:\libiio\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release ..
        shell: cmd
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
        shell: cmd
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-windows-x64
          path: build/Release/DrFPV.exe
