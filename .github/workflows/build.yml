name: Build DrFPV for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt'
          setup-python: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: powershell

      - name: Install libiio via vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install libiio:x64-windows
        shell: cmd

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_TOOLCHAIN_FILE=D:\a\DrFPV\DrFPV\vcpkg\scripts\buildsystems\vcpkg.cmake ^
                -DVCPKG_ROOT=D:\a\DrFPV\DrFPV\vcpkg ^
                -DVCPKG_TARGET_TRIPLET=x64-windows ^
                -DVCPKG_INSTALLED_DIR=D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows ^
                -DLIBIIO_INCLUDE_DIR=D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows\include ^
                -DLIBIIO_LIBRARY=D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows\lib\libiio.lib ^
                -DCMAKE_CXX_COMPILER=cl.exe ^
                -DCMAKE_C_COMPILER=cl.exe ..
        shell: cmd

      - name: Build
        run: |
          cd build
          ninja
        shell: cmd

      - name: Deploy Qt and dependencies
        run: |
          mkdir package
          copy build\DrFPV.exe package\
          windeployqt --release --no-translations --no-opengl --no-system-d3d-compiler package\DrFPV.exe
          copy D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows\bin\libiio.dll package\
          for /f "delims=" %i in ('where vcruntime140.dll') do copy "%i" package\
          for /f "delims=" %i in ('where msvcp140.dll') do copy "%i" package\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-windows-x64
          path: package/
