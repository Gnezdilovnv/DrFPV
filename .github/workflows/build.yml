name: Build DrFPV for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt'
          setup-python: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and extract libiio
        run: |
          curl -L -o libiio.zip https://github.com/analogdevicesinc/libiio/releases/download/v0.25/libiio-0.25-windows-x64.zip
          mkdir libiio
          tar -xf libiio.zip -C libiio
          dir libiio\bin
          dir libiio\lib
        shell: cmd

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DLIBIIO_INCLUDE_DIR=D:\a\DrFPV\DrFPV\libiio\include ^
                -DLIBIIO_LIBRARY=D:\a\DrFPV\DrFPV\libiio\lib\libiio.lib ^
                -DCMAKE_CXX_COMPILER=cl.exe ^
                -DCMAKE_C_COMPILER=cl.exe ..
        shell: cmd

      - name: Build
        run: |
          cd build
          ninja
        shell: cmd

      - name: Deploy Qt and dependencies
        run: |
          mkdir package
          copy build\DrFPV.exe package\
          windeployqt --release --no-translations --no-opengl --no-system-d3d-compiler package\DrFPV.exe
          copy D:\a\DrFPV\DrFPV\libiio\bin\libiio.dll package\
          for /f "delims=" %i in ('where vcruntime140.dll') do copy "%i" package\
          for /f "delims=" %i in ('where msvcp140.dll') do copy "%i" package\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-windows-x64
          path: package/
