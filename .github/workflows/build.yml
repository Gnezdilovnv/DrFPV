name: Build DrFPV

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt5-qmake qtbase5-dev libiio-dev
        
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
        
      - name: Build
        run: |
          cd build
          make -j$(nproc)
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-linux
          path: build/DrFPV
