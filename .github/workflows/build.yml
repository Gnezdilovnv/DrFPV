name: Build DrFPV for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt'
          setup-python: false

      - name: Install vcpkg and libiio
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install libiio:x64-windows
        shell: cmd

      - name: Add vcpkg to PATH
        run: echo "D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 16 2019" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=D:\a\DrFPV\DrFPV\vcpkg\scripts\buildsystems\vcpkg.cmake ..
        shell: cmd

      - name: Build
        run: |
          cd build
          cmake --build . --config Release
        shell: cmd

      - name: Deploy Qt and collect dependencies
        run: |
          mkdir package
          copy build\Release\DrFPV.exe package\
          windeployqt --release --no-translations --no-opengl --no-system-d3d-compiler package\DrFPV.exe
          copy D:\a\DrFPV\DrFPV\vcpkg\installed\x64-windows\bin\libiio.dll package\
          for /f "delims=" %i in ('where vcruntime140.dll') do copy "%i" package\
          for /f "delims=" %i in ('where msvcp140.dll') do copy "%i" package\
        shell: cmd

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-windows-x64
          path: package/
