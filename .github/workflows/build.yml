name: Build DrFPV for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: D:\a\DrFPV\DrFPV\qt\Qt
          key: ${{ runner.os }}-qt-5.15.2-msvc2019_64

      - name: Install Qt (if not cached)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          choco install 7zip -y
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir D:\a\DrFPV\DrFPV\qt\Qt --external 7z --mirror https://mirrors.tuna.tsinghua.edu.cn/qt
        shell: powershell

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and install libiio
        run: |
          curl -L -o libiio-setup.exe https://github.com/analogdevicesinc/libiio/releases/download/v0.25/libiio-0.25-windows-setup.exe
          if exist libiio-setup.exe (
            echo "Installer downloaded successfully"
            start /wait libiio-setup.exe /S /D=C:\libiio
          ) else (
            echo "Download failed, trying alternative URL"
            curl -L -o libiio-setup.exe https://github.com/analogdevicesinc/libiio/releases/download/v0.25/libiio-0.25-windows-x64.exe
            start /wait libiio-setup.exe /S /D=C:\libiio
          )
        shell: cmd

      - name: Add libiio to PATH
        run: echo "C:\libiio\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -G Ninja ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DLIBIIO_INCLUDE_DIR=C:\libiio\include ^
                -DLIBIIO_LIBRARY=C:\libiio\lib\libiio.lib ^
                -DCMAKE_CXX_COMPILER=cl.exe ^
                -DCMAKE_C_COMPILER=cl.exe ..
        shell: cmd

      - name: Build
        run: |
          cd build
          ninja
        shell: cmd

      - name: Deploy Qt and dependencies
        run: |
          mkdir package
          copy build\DrFPV.exe package\
          windeployqt --release --no-translations --no-opengl --no-system-d3d-compiler package\DrFPV.exe
          copy C:\libiio\bin\libiio.dll package\
          for /f "delims=" %i in ('where vcruntime140.dll') do copy "%i" package\
          for /f "delims=" %i in ('where msvcp140.dll') do copy "%i" package\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrFPV-windows-x64
          path: package/
